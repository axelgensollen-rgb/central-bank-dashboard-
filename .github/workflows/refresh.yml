name: Refresh central-bank dashboard

on:
  workflow_dispatch:
  schedule:
    # GitHub cron is UTC. Run candidate slots for both CET and CEST.
    # The Paris-hour gate below keeps only 07:xx, 12:xx and 18:xx.
    - cron: '5 5,6,10,11,16,17 * * *'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Paris refresh slot
        id: slot
        run: |
          HOUR=$(TZ=Europe/Paris date +%H)
          if [ "$HOUR" = "07" ] || [ "$HOUR" = "12" ] || [ "$HOUR" = "18" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Refresh verified public data
        if: steps.slot.outputs.run == 'true'
        run: env -u GITHUB_ACTIONS python scripts/refresh.py
      - name: Commit changed data
        if: steps.slot.outputs.run == 'true'
        run: |
          git config user.name "central-bank-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/central-banks.json
          git diff --cached --quiet || git commit -m "Refresh central bank data"
          git push
