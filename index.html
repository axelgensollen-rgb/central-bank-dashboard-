<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Central Bank Pulse</title><style>:root{--line:#20242c;--text:#f4f7fb;--muted:#8e98a8;--accent:#4ee1c1;--red:#ff667d;--amber:#ffc65c}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 0,#12192a 0,#050608 36%);color:var(--text);font-family:Inter,Arial,sans-serif}.wrap{max-width:1220px;margin:auto;padding:32px 24px}.top{display:flex;justify-content:space-between;align-items:end;gap:20px}.brand{font-size:12px;letter-spacing:.18em;color:var(--accent);font-weight:800}.top h1{font-size:32px;margin:7px 0}.muted{color:var(--muted)}.status{display:flex;gap:8px;flex-wrap:wrap}.pill{padding:9px 12px;border:1px solid var(--line);border-radius:999px;background:#090b0f;font-size:12px}.live:before{content:'';display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-right:7px}.tabs{display:grid;grid-template-columns:repeat(8,1fr);gap:8px;margin:28px 0 16px}.tab{border:1px solid var(--line);background:#090b0f;color:var(--muted);border-radius:13px;padding:13px 8px;cursor:pointer;font-weight:700}.tab.active{background:linear-gradient(135deg,#13241f,#101727);color:#fff;border-color:#3c776b}.flag{font-size:20px;display:block;margin-bottom:5px}.hero{display:grid;grid-template-columns:1.5fr .7fr .7fr;gap:12px}.box,.panel{background:linear-gradient(145deg,#0d1015,#080a0d);border:1px solid var(--line);border-radius:18px;padding:20px}.bankname{font-size:27px;font-weight:800}.metric{font-size:36px;font-weight:800;margin-top:12px}.label{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}.content{display:grid;grid-template-columns:1.25fr .75fr;gap:12px;margin-top:12px}.chart{height:270px;position:relative;border-left:1px solid #252a33;border-bottom:1px solid #252a33}.empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:var(--muted);padding:30px}.meeting{border:1px solid var(--line);border-radius:13px;padding:13px}.meetingtop{display:flex;justify-content:space-between;margin-bottom:11px}.probs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.prob{background:#11141a;border-radius:9px;padding:9px;text-align:center}.prob b{display:block;font-size:16px}.up{color:var(--red)}.hold{color:var(--amber)}.down{color:var(--accent)}.footer{font-size:11px;color:#657083;margin-top:12px}@media(max-width:850px){.tabs{grid-template-columns:repeat(4,1fr)}.hero,.content{grid-template-columns:1fr}.top{align-items:start;flex-direction:column}}@media(max-width:480px){.tabs{grid-template-columns:repeat(2,1fr)}}</style></head><body><main class="wrap"><header class="top"><div><div class="brand">CENTRAL BANK PULSE</div><h1>Rate Probability Dashboard</h1><div class="muted">Politique monétaire • probabilités implicites</div></div><div class="status"><span class="pill live">Dynamique</span><span class="pill">07:05 · 12:05 · 18:05 Paris</span><span class="pill" id="last">Chargement…</span></div></header><nav class="tabs" id="tabs"></nav><section class="hero"><div class="box"><div class="label">Banque centrale</div><div class="bankname" id="bankname"></div><div class="muted" id="fullname"></div></div><div class="box"><div class="label">Taux directeur</div><div class="metric" id="rate">—</div></div><div class="box"><div class="label">Prochaine réunion</div><div class="metric" style="font-size:22px" id="next">—</div></div></section><section class="content"><div class="panel"><h3>Courbe de taux implicite</h3><div class="chart"><div class="empty" id="curve">Données de courbe en attente de validation.</div></div><div class="footer" id="source"></div></div><div class="panel"><h3>Probabilités de réunion</h3><div id="meetings"></div></div></section></main><script>const banks=[{f:'🇺🇸',s:'FED',n:'Federal Reserve'},{f:'🇪🇺',s:'BCE',n:'Banque centrale européenne'},{f:'🇬🇧',s:'BoE',n:'Bank of England'},{f:'🇯🇵',s:'BoJ',n:'Bank of Japan'},{f:'🇨🇦',s:'BoC',n:'Bank of Canada'},{f:'🇦🇺',s:'RBA',n:'Reserve Bank of Australia'},{f:'🇨🇭',s:'BNS',n:'Banque nationale suisse'},{f:'🇳🇿',s:'RBNZ',n:'Reserve Bank of New Zealand'}];let active=0,data=null;const fmt=v=>v==null?'N/D':Number(v).toFixed(1)+'%';async function load(){try{const r=await fetch('data/central-banks.json?'+Date.now());data=await r.json();last.textContent='Données : '+data.updated_at;source.textContent='Source : '+data.source;render()}catch(e){last.textContent='Données indisponibles';render()}}function render(){tabs.innerHTML='';banks.forEach((b,i)=>{const e=document.createElement('button');e.className='tab '+(i===active?'active':'');e.innerHTML='<span class="flag">'+b.f+'</span>'+b.s;e.onclick=()=>{active=i;render()};tabs.appendChild(e)});const b=banks[active],d=data?.banks?.[b.s];bankname.textContent=b.f+' '+b.s;fullname.textContent=b.n;rate.textContent=d?.rate!=null?d.rate.toFixed(2)+'%':'N/D';next.textContent=d?.next||'N/D';meetings.innerHTML='<div class="meeting"><div class="meetingtop"><b>Prochaine réunion</b><span class="muted">'+(d?.next||'Non disponible')+'</span></div><div class="probs"><div class="prob"><span class="label">Hausse</span><b class="up">'+fmt(d?.up)+'</b></div><div class="prob"><span class="label">Statu quo</span><b class="hold">'+fmt(d?.hold)+'</b></div><div class="prob"><span class="label">Baisse</span><b class="down">'+fmt(d?.down)+'</b></div></div></div>';curve.textContent='Courbe complète : branchement des points de maturité en cours.'}render();load()</script></body></html>
